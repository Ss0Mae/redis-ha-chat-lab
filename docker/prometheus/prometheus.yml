global: { scrape_interval: 1s, evaluation_interval: 1s }
scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['lab-app:8080'] }]
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ['redis://172.28.0.11:6379']
        labels: { topology: single, node: r-0 }
      - { targets: ['redis://172.28.1.11:6379'], labels: { topology: sentinel, node: r-a-1 } }
      - { targets: ['redis://172.28.1.12:6379'], labels: { topology: sentinel, node: r-a-2 } }
      - { targets: ['redis://172.28.1.13:6379'], labels: { topology: sentinel, node: r-a-3 } }
      - { targets: ['redis://172.28.2.11:6379'], labels: { topology: cluster, node: c-1 } }
      - { targets: ['redis://172.28.2.12:6379'], labels: { topology: cluster, node: c-2 } }
      - { targets: ['redis://172.28.2.13:6379'], labels: { topology: cluster, node: c-3 } }
      - { targets: ['redis://172.28.2.14:6379'], labels: { topology: cluster, node: c-4 } }
      - { targets: ['redis://172.28.2.15:6379'], labels: { topology: cluster, node: c-5 } }
      - { targets: ['redis://172.28.2.16:6379'], labels: { topology: cluster, node: c-6 } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'redis-exporter:9121' }
